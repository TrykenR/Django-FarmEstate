{% extends "farmApp/base.html" %}
{% block title %}Iniciar sesión - FarmEstate{% endblock %}

{% block content %}

<div style="max-width: 450px; margin: 60px auto;">
    <div class="card" style="padding: 40px;">
        <!-- Logo/Header -->
        <div style="text-align: center; margin-bottom: 30px;">
            <span style="font-size: 4rem; display: block; margin-bottom: 10px;">🌾</span>
            <h2 style="margin: 0 0 10px 0; color: #2d6a3d;">Iniciar sesión</h2>
            <p style="color: #4a6a4a; margin: 0;">Accede a tu panel de control</p>
        </div>

        {% if error %}
            <div class="alert" style="background: #fee; border-left-color: #d32f2f;">
                <span style="color: #d32f2f;">❌ {{ error }}</span>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>👤 Usuario</label>
            <input 
                type="text" 
                name="username" 
                required 
                placeholder="Ingresa tu usuario"
                autofocus
            >

            <label>🔒 Contraseña</label>
            <input 
                type="password" 
                name="password" 
                required 
                placeholder="Ingresa tu contraseña"
            >

            <button type="submit" class="btn" style="width: 100%; justify-content: center; font-size: 1.05rem; margin-top: 10px;">
                🔐 Ingresar
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid #e0e0e0;">
            <p style="color: #4a6a4a; font-size: 0.9rem;">
                ¿Primera vez aquí? Contacta al administrador
            </p>
        </div>
    </div>
</div>

{% endblock %}
