{% extends "farmApp/base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 30px auto;">
    <h2>🌱 {{ titulo }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="submit" class="btn">
                💾 Guardar
            </button>
            <a href="{% url 'listar_huertos' %}" class="btn btn-secondary">
                ❌ Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
